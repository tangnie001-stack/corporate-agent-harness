# nginx/edge.conf —— 入口机（公网 ECS）配置：TLS 终结 + 反代到应用机
#
# 部署位置：/etc/nginx/conf.d/corporate-rag.conf（dnf 安装的 nginx，conf.d 在 http 块里被 include）
# 证书位置：/etc/nginx/certs/<域名>/{fullchain.pem,privkey.pem}
#
# 前置（缺任一条 nginx 起不来）：
#   1) 三份证书就位（阿里云下载的 <域名>.pem / <域名>.key 需改名为 fullchain.pem / privkey.pem）
#   2) /etc/nginx/nginx.conf 里自带的默认 server（`listen 80 default_server;`）必须注释掉 ——
#      否则与本文件的 default_server 冲突：a duplicate default server for 0.0.0.0:80
#   3) 应用机的 nginx 以 origin 模式运行（只监听 80、不做 TLS、不跳转），见 deploy/nginx/nginx.conf
#
# 职责边界：入口机只做「TLS + 80→443 + 反代 + 访问日志脱敏」，
#           静态页与业务路由都在应用机（按 Host 分流），这里不再重复一份路由规则。

map $request_uri $masked_uri {
    default $request_uri;
    "~^(?<alert_prefix>.*/alerts/webhook/)[^/?#]+(?<alert_suffix>.*)$" "$alert_prefix***$alert_suffix";
}

log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $masked_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server_tokens off;

# 上传上限：必须与后端一致（应用侧 MAX_FILE_SIZE 默认 10MB，nginx 侧 12m）
# 入口是第一跳，这里小了会直接 413，后端根本看不到请求
client_max_body_size 12m;

gzip on;
gzip_types text/css application/javascript application/json;
gzip_min_length 256;

# 80 → https：目标主机把裸域收敛到 www，其余保持原域名
map $host $https_host {
    default    $host;
    tangnie.cn www.tangnie.cn;
}

server {
    listen 80 default_server;
    server_name www.tangnie.cn api.tangnie.cn langfuse.tangnie.cn tangnie.cn _;

    access_log /var/log/nginx/corporate-rag-access.log masked;

    location / {
        return 301 https://$https_host$request_uri;
    }
}

# 443 默认块：不提供证书，直接拒绝握手（避免用 IP / 未配置域名访问时拿到错证书）
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ── 站点 www.tangnie.cn ──
server {
    listen 443 ssl;
    server_name www.tangnie.cn;

    ssl_certificate     /etc/nginx/certs/www.tangnie.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/www.tangnie.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/corporate-rag-access.log masked;

    location / {
        proxy_pass http://172.30.18.60:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;

        # SSE 必须关 buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

# ── 接口 api.tangnie.cn ──
server {
    listen 443 ssl;
    server_name api.tangnie.cn;

    ssl_certificate     /etc/nginx/certs/api.tangnie.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.tangnie.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/corporate-rag-access.log masked;

    location / {
        proxy_pass http://172.30.18.60:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

# ── Langfuse 控制台 langfuse.tangnie.cn ──
server {
    listen 443 ssl;
    server_name langfuse.tangnie.cn;

    ssl_certificate     /etc/nginx/certs/langfuse.tangnie.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/langfuse.tangnie.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/corporate-rag-access.log masked;

    location / {
        proxy_pass http://172.30.18.60:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}
