# nginx/nginx.conf —— 应用机（origin）配置：只监听 80，按 Host 分流
#
# 拓扑：公网 → 入口机（TLS 终结，deploy/nginx/edge.conf）→ 本机 80
# 因此本文件**不做 TLS、不做 80→443 跳转**：那是入口机的职责。
# 本机若也跳 https 会与入口机形成死循环（入口 http 回源 → 本机 301 → 浏览器回入口 …）。
#
# 分流规则：
#   www.tangnie.cn       静态页 + /api 同源反代（前端用相对路径）
#   api.tangnie.cn       整站反代给 app（外部系统 / 脚本调用，网页不经它）
#   langfuse.tangnie.cn  反代 langfuse-web:3000
#   其它 Host（含部署脚本的 127.0.0.1）只放行 /api/health

# 告警端点的鉴权 token 放在 URL 路径里（上游是 Grafana 的 contact point，
# 它不支持自定义请求头）。token 是该端点的唯一凭据，**不得进访问日志** ——
# 故这里把该段掩成 `***` 后再落盘；其余路径原样记录（等价默认 combined 格式）。
map $request_uri $masked_uri {
    default $request_uri;
    "~^(?<alert_prefix>.*/alerts/webhook/)[^/?#]+(?<alert_suffix>.*)$" "$alert_prefix***$alert_suffix";
}

log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $masked_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# upstream 一律用「变量 + Docker 内置 DNS」延迟解析，不要写死 `proxy_pass http://app:8000`。
# 原因：静态 upstream 只在**配置加载时**解析一次并缓存在 master 里，app 容器重建拿到新 IP 后，
# nginx 仍发往旧 IP ⇒ connect() failed (111) ⇒ 502，且应用日志一条都没有（请求没进来）。
# 变量化后按 valid 周期自动重解析，重建容器不再需要手工 restart nginx。
resolver 127.0.0.11 valid=10s ipv6=off;

# 真实客户端 IP：入口机（172.30.18.58）反代过来的 X-Forwarded-For 里是最初的客户端。
# 不做这一步，日志 / 限流 / 排查看到的全是入口机内网 IP。
set_real_ip_from 172.30.18.58;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# TLS 已在入口机终结，本机 $scheme 恒为 http —— 上游给了就透传，没给才退回本机 scheme，
# 否则应用侧会认为自己是 http，登录跳转 / 绝对 URL 会拼错协议。
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server_tokens off;

# 上传上限：必须 ≥ 应用侧 MAX_FILE_SIZE（src/config/settings.py，默认 10MB）
# 入口机同样是 12m；两处必须一致，否则小的一方先挡（413 出现在谁身上会误导排查）
client_max_body_size 12m;

gzip on;
gzip_types text/css application/javascript application/json;
gzip_min_length 256;

# ── 默认块：只放行部署健康检查 ──
# deploy.sh 探测 http://127.0.0.1/api/health（Host 不匹配任何域名 ⇒ 落到这里）
server {
    listen 80 default_server;
    server_name _;

    set $app_upstream "app:8000";
    access_log /dev/stdout masked;

    location = /api/health {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}

# ── www.tangnie.cn：静态页 + /api 同源反代 ──
server {
    listen 80;
    server_name www.tangnie.cn;

    set $app_upstream "app:8000";
    access_log /dev/stdout masked;

    # Frontend static files — HTML 不缓存，JS/CSS 通过 version 参数更新
    location = /Knowledgebase {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index chat.html;
        try_files $uri $uri/ $uri.html /chat.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API reverse proxy（同源：前端 fetch('/api/...') 落在这里）
    location /api/ {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_cache_bypass $http_upgrade;

        # Retry on reload/transient failures
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;

        # SSE requires buffering to be off
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # OpenAPI docs — pass through
    location /docs {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /openapi.json {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}

# ── api.tangnie.cn：整站反代给 app ──
server {
    listen 80;
    server_name api.tangnie.cn;

    set $app_upstream "app:8000";
    access_log /dev/stdout masked;

    location / {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;

        # SSE requires buffering to be off
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

# ── langfuse.tangnie.cn：反代 Langfuse 控制台 ──
# 变量 + Docker 内置 DNS 延迟解析：langfuse-web 未启动时 nginx 仍能起来
# （静态 upstream 会在启动期解析失败，那会连带整站起不来）
server {
    listen 80;
    server_name langfuse.tangnie.cn;

    access_log /dev/stdout masked;

    # 同 app：变量化 upstream（resolver 在 http 级统一声明），容器重建不需要 restart nginx
    set $langfuse_upstream "langfuse-web:3000";

    location / {
        proxy_pass http://$langfuse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
