# nginx/nginx.conf
#
# 对外入口（TLS 在 nginx 终止；证书从宿主 /opt/www/certs 只读挂载，见 docker-compose.image.yml）：
#   80   —— 只放行部署健康检查，其余 301 到 https（裸域 tangnie.cn → www）
#   443  —— www.tangnie.cn       站点静态页 + /api 同源反代（前端用相对路径，不跨域）
#            api.tangnie.cn       纯接口，给外部系统 / 脚本调用（网页不经它）
#            langfuse.tangnie.cn  Langfuse 控制台（生产不再对外开 3000）
#
# 证书目录：/etc/nginx/certs/<域名>/{fullchain.pem,privkey.pem}
#   通配符 / 多域名证书就把同一份文件拷进对应目录，不要改这里的路径。

# 告警端点的鉴权 token 放在 URL 路径里（上游是 Grafana 的 contact point，
# 它不支持自定义请求头）。token 是该端点的唯一凭据，**不得进访问日志** ——
# 故这里把该段掩成 `***` 后再落盘；其余路径原样记录（等价默认 combined 格式）。
map $request_uri $masked_uri {
    default $request_uri;
    "~^(?<alert_prefix>.*/alerts/webhook/)[^/?#]+(?<alert_suffix>.*)$" "$alert_prefix***$alert_suffix";
}

log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $masked_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# 80 → https 的目标主机：裸域收敛到 www，其余保持原域名
map $host $https_host {
    default    $host;
    tangnie.cn www.tangnie.cn;
}

# ── http 级公共项（各 server 块共享）──

# 上传上限：必须 ≥ 应用侧 MAX_FILE_SIZE（src/config/settings.py，默认 10MB）
# nginx 默认仅 1m，不改会让真实 PDF 上传直接被 413 挡在网关层（应用侧看不到）
client_max_body_size 12m;

gzip on;
gzip_types text/css application/javascript application/json;
gzip_min_length 256;

# ── 80：只放行健康检查，其余跳 https ──
server {
    listen 80 default_server;
    server_name www.tangnie.cn api.tangnie.cn langfuse.tangnie.cn tangnie.cn _;

    # 写在 server 层才会**取代** http 层的默认 access_log（该默认格式未脱敏）。
    # 若写在 http 层，两者会同时生效 → token 仍会以原文落进默认那条。
    access_log /dev/stdout masked;

    # 部署脚本的健康探测固定走 http://127.0.0.1/api/health（Host 不匹配任何域名 ⇒ 落到本默认块），
    # 该请求不进 https 跳转，否则 deploy.sh 的 wait_healthy 只会拿到 301。
    location = /api/health {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$https_host$request_uri;
    }
}

# ── 443 默认块：不提供证书，直接拒绝握手 ──
# 覆盖「用 IP 或未配置域名访问 https」，避免浏览器拿到一张域名不匹配的证书
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ── 443：站点 www.tangnie.cn（静态页 + /api 同源反代）──
server {
    listen 443 ssl;
    server_name www.tangnie.cn;

    ssl_certificate     /etc/nginx/certs/www.tangnie.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/www.tangnie.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /dev/stdout masked;

    # Frontend static files — HTML 不缓存，JS/CSS 通过 version 参数更新
    # 注：location 里一旦出现 add_header，server 级的 add_header（HSTS）就不再继承 → 这里必须重复声明
    location = /Knowledgebase {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index chat.html;
        try_files $uri $uri/ $uri.html /chat.html;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API reverse proxy（同源：前端 fetch('/api/...') 落在这里）
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Retry on reload/transient failures
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;

        # SSE requires buffering to be off
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # OpenAPI docs — pass through
    location /docs {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# ── 443：接口 api.tangnie.cn（整站反代给 app，/api/* 与 /docs 均可用）──
# 网页不直连本域（那样要改 26 处前端调用并重配 CORS 与 cookie），
# 它的用途是给外部系统 / 脚本 / 未来切换留口子。
server {
    listen 443 ssl;
    server_name api.tangnie.cn;

    ssl_certificate     /etc/nginx/certs/api.tangnie.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.tangnie.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /dev/stdout masked;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;

        # SSE requires buffering to be off
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

# ── 443：Langfuse 控制台（生产容器不再对外发布 3000）──
server {
    listen 443 ssl;
    server_name langfuse.tangnie.cn;

    ssl_certificate     /etc/nginx/certs/langfuse.tangnie.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/langfuse.tangnie.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /dev/stdout masked;

    # 变量 + Docker 内置 DNS 延迟解析：langfuse-web 未启动时 nginx 仍能起来。
    # 静态 upstream 会在启动期解析失败，那会让**整站**（含站点与接口）起不来。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $langfuse_upstream "langfuse-web:3000";

    location / {
        proxy_pass http://$langfuse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
