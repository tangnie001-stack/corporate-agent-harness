# nginx/nginx.conf
#
# 告警端点的鉴权 token 放在 URL 路径里（上游是 Grafana 的 contact point，
# 它不支持自定义请求头）。token 是该端点的唯一凭据，**不得进访问日志** ——
# 故这里把该段掩成 `***` 后再落盘；其余路径原样记录（等价默认 combined 格式）。
map $request_uri $masked_uri {
    default $request_uri;
    "~^(?<alert_prefix>.*/alerts/webhook/)[^/?#]+(?<alert_suffix>.*)$" "$alert_prefix***$alert_suffix";
}

log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $masked_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name localhost;

    # 写在 server 层才会**取代** http 层的默认 access_log（该默认格式未脱敏）。
    # 若写在 http 层，两者会同时生效 → token 仍会以原文落进默认那条。
    access_log /dev/stdout masked;

    # 上传上限：必须 ≥ 应用侧 MAX_FILE_SIZE（src/config/settings.py，默认 10MB）
    # nginx 默认仅 1m，不改会让真实 PDF 上传直接被 413 挡在网关层（应用侧看不到）
    client_max_body_size 12m;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript text/html application/json;
    gzip_min_length 256;

    # Frontend static files — HTML 不缓存，JS/CSS 通过 version 参数更新
    location = /Knowledgebase {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index chat.html;
        try_files $uri $uri/ $uri.html /chat.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Retry on reload/transient failures
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;

        # SSE requires buffering to be off
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # OpenAPI docs — pass through
    location /docs {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
