// ── Think 折叠行（reasoning 事件累积渲染，前端推断边界）──
let currentThinkRow = null;

// 取思考文本最新一行（流式中摘要跟随最新行）
function latestReasoningLine(text) {
  const visible = text.replace(/\s+$/, '');
  const newline = visible.lastIndexOf('\n');
  return newline === -1 ? visible : visible.slice(newline + 1);
}

// 定型当前 Think 行（折叠摘要固定为首行，不再累积）
function closeThinkRow() {
  if (currentThinkRow) {
    const body = currentThinkRow.querySelector('.think-body');
    const summary = currentThinkRow.querySelector('.think-summary');
    if (body && summary) {
      const full = body.textContent;
      const newline = full.indexOf('\n');
      summary.textContent = newline === -1 ? full : full.slice(0, newline);
    }
    currentThinkRow = null;
  }
}

// 渲染思考增量（无活跃 Think 行则创建，默认折叠）
function renderReasoningDelta(delta) {
  if (!delta) return;
  if (!currentThinkRow) {
    const details = document.createElement('details');
    details.className = 'think-row';
    details.innerHTML = `
      <summary>
        <span class="think-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg></span>
        <span class="think-title">Think</span>
        <span class="think-summary"></span>
        <span class="think-chevron"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </summary>
      <div class="think-body"></div>`;
    mountProcessElement(details);
    closeStatusGroup(); // think-row 为非 status 元素，入容器后闭合当前 status 组
    currentThinkRow = details;
    scrollToBottom();
  }
  const body = currentThinkRow.querySelector('.think-body');
  const summary = currentThinkRow.querySelector('.think-summary');
  body.textContent += delta;
  summary.textContent = latestReasoningLine(body.textContent);
}

// ── delegate 过程折叠区（core change；按 delegate_id 分节，一次回答多次委派不串流）──
// 中断原因 → 中文短词（与后端 const.SSEInteractionTexts.DELEGATE_REASON_TEXT 同步；
// 后端不随 SSE 下发行内文案，前端维护同一张表，勿只用裸 reason 码展示）
const DELEGATE_REASON_TEXT = {
  idle: '空闲超时',
  total: '超时',
  turn: '轮次上限',
  failed: '失败',
  cancelled: '已取消',
};
// delegate_id → { section, dot, status, thinkBody, contentBody, thinkLen, contentLen, finished }
const delegateSections = new Map();

function ensureDelegateSection(data) {
  const did = data.delegate_id;
  if (!did) return null;
  let sec = delegateSections.get(did);
  if (sec) return sec;
  // 委派 start 为工具边界：固化待定区（首个工具前的旁白）+ 回溯重分类
  // （工具调用之间的旁白），其后 token 才是正文候选
  toolCallSeen = true;
  flushPendingAsPreamble();
  reclassifyNarrationAsPreamble();
  const section = document.createElement('section');
  section.className = 'delegate-progress';
  section.dataset.did = did;
  const title = escapeHtml(data.skill || '专家') + ' · 领域专家分析';
  section.innerHTML = `
    <button type="button" class="delegate-head" aria-expanded="true">
      <span class="delegate-dot running"></span>
      <span class="delegate-title">${title}</span>
      <span class="delegate-status">正在分析…</span>
      <svg class="delegate-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="delegate-body">
      <details class="delegate-think" open>
        <summary>思考过程</summary>
        <div class="delegate-think-body"></div>
      </details>
      <div class="delegate-content"></div>
    </div>`;
  mountProcessElement(section);
  closeStatusGroup(); // 委派节为非 status 元素，入容器后闭合当前 status 组
  const head = section.querySelector('.delegate-head');
  head.addEventListener('click', () => {
    const closed = section.classList.toggle('closed');
    head.setAttribute('aria-expanded', String(!closed));
  });
  const s = {
    section,
    dot: section.querySelector('.delegate-dot'),
    status: section.querySelector('.delegate-status'),
    thinkBody: section.querySelector('.delegate-think-body'),
    contentBody: section.querySelector('.delegate-content'),
    thinkLen: 0,
    contentLen: 0,
    finished: false,
  };
  delegateSections.set(did, s);
  scrollToBottom();
  return s;
}

function appendDelegateDelta(data) {
  const s = delegateSections.get(data.delegate_id);
  if (!s || s.finished) {
    if (!s) console.warn('delegate delta without open section', data.delegate_id);
    return;
  }
  const delta = data.delta || '';
  if (!delta) return;
  if (data.kind === 'thinking') {
    s.thinkBody.textContent += delta;
    s.thinkLen += delta.length;
  } else {
    s.contentBody.textContent += delta;
    s.contentLen += delta.length;
  }
  scrollToBottom();
}

function finalizeDelegateSection(data) {
  const s = delegateSections.get(data.delegate_id);
  if (!s || s.finished) return;
  s.finished = true;
  const ok = data.ok !== false;
  const reason = data.reason || '';
  if (ok) {
    s.dot.classList.remove('running');
    s.dot.classList.add('done');
    s.status.textContent = '领域专家分析完成';
    s.status.classList.remove('error');
  } else {
    const text = DELEGATE_REASON_TEXT[reason] || reason;
    s.dot.classList.remove('running');
    s.dot.classList.add('error');
    s.status.textContent = '分析中断 · ' + (text || reason);
    s.status.classList.add('error');
  }
  scrollToBottom();
}

// 兜底：本轮收尾（done(cancelled)/error/EOF 终止）时仍未收到 delegate end 的节，
// 置为中断态——fork 取消时 end 事件可能因 drain task 先被 cancel 而丢失（H2），
// 避免前端永远停在"正在分析…"呼吸点
function finalizePendingDelegateSections(reason) {
  for (const [did, s] of delegateSections) {
    if (!s.finished) {
      s.finished = true;
      s.dot.classList.remove('running');
      s.dot.classList.add('error');
      const text = DELEGATE_REASON_TEXT[reason] || reason || '中断';
      s.status.textContent = '分析中断 · ' + text;
      s.status.classList.add('error');
    }
  }
}

function resetDelegateSections() {
  delegateSections.clear();
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  // innerHTML 只转义 & < >，额外转义引号以适配双引号属性上下文（data-name 等）
  return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ── SSE 传输层：fetch + getReader 手动解析（替代原生 EventSource）──
function fetchStream(url, options, handlers) {
  const controller = new AbortController();
  const start = async () => {
    const resp = await fetch(url, { ...options, signal: controller.signal });
    if (!resp.ok || !resp.body) {
      const err = new Error('HTTP ' + resp.status);
      err.status = resp.status;
      handlers.onError && handlers.onError(err);
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        parseSSE(frame, handlers);
      }
    }
    handlers.onClose && handlers.onClose();
  };
  start().catch((e) => handlers.onError && handlers.onError(e));
  return { controller, url };
}

function parseSSE(frame, handlers) {
  const lines = frame.split('\n');
  let eventName = 'message';
  let data = '';
  for (const line of lines) {
    if (line.startsWith('event:')) eventName = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trim();
  }
  if (!data) return;
  const payload = JSON.parse(data);
  const h = handlers[eventName];
  h && h(payload);
}

// ── 流式聊天：POST /api/chat/stream + fetchStream ──
// 断线重连计数（指数退避 1s/2s/4s，最多 3 次；新提问/流正常结束时归零）
let streamRetryCount = 0;

// 统一事件渲染 handlers：startStream 与 resumeStream 复用同一套
// （各事件回调记录 lastSeq，作为断线续接 after_seq 基准；seq 由后端注入帧 data）
function buildStreamHandlers() {
  return {
    status: (data) => {
      try {
        state.lastSeq = (data.seq !== undefined) ? data.seq : state.lastSeq;
        closeThinkRow();
        renderStatusTag(data.stage, data.message, data.detail);
      } catch (err) { /* ignore */ }
    },
    reasoning: (data) => {
      try {
        state.lastSeq = (data.seq !== undefined) ? data.seq : state.lastSeq;
        renderReasoningDelta(data.delta || '');
      } catch (err) { /* ignore */ }
    },
    token: (data) => {
      try {
        state.lastSeq = (data.seq !== undefined) ? data.seq : state.lastSeq;
        closeThinkRow();
        renderAiAnswerStream(data.token || '');
      } catch (err) { /* ignore */ }
    },
    citation: (data) => {
      try {
        state.lastSeq = (data.seq !== undefined) ? data.seq : state.lastSeq;
        renderCitation(data.source, data.page, data.snippet || '', data.index || 0, data.tier);
      } catch (err) { /* ignore */ }
    },
    ask_user: (data) => {
      try {
        state.lastSeq = (data.seq !== undefined) ? data.seq : state.lastSeq;
        closeThinkRow(); // D6：澄清暂停不复位过程容器，澄清后帧继续进原容器
        // ask_user 为工具边界：澄清前的话是旁白——固化待定区 + 回溯重分类
        toolCallSeen = true;
        flushPendingAsPreamble();
        reclassifyNarrationAsPreamble();
        // 不关流：SSE 保持连接，composer 接管输入区，提交后同流续答
        state.current = STATE.CLARIFYING;
        hideInputArea();
        hideStopBtn();
        renderComposer(data.questions || []);
      } catch (err) { /* ignore */ }
    },
    abstention: (data) => {
      try {
        state.lastSeq = (data.seq !== undefined) ? data.seq : state.lastSeq;
        closeThinkRow();
        renderAbstention(data.message || '未在文档中找到相关数据，可尝试转人工咨询');
      } catch (err) { /* ignore */ }
    },
    delegate: (data) => {
      try {
        state.lastSeq = (data.seq !== undefined) ? data.seq : state.lastSeq;
        if (data.action === 'start') {
          ensureDelegateSection(data);
        } else if (data.action === 'delta') {
          appendDelegateDelta(data);
          // 看板实时活动摘要：execution 条目的 task_id=delegate_id，delta 派生到 activity
          appendDelegateActivity(data.delegate_id, data.delta || '');
        } else if (data.action === 'end') {
          finalizeDelegateSection(data);
        }
      } catch (err) { /* ignore */ }
    },
    task: (data) => {
      try {
        state.lastSeq = (data.seq !== undefined) ? data.seq : state.lastSeq;
        if (data.action === 'terminal' && data.task) {
          upsertTask(data);   // 终态保留在面板（状态胶囊置终态），不删条目
        } else if (data.action === 'created' || data.action === 'updated') {
          upsertTask(data);
        }
      } catch (err) { /* ignore */ }
    },
    model_info: (data) => {
      try {
        state.lastSeq = (data.seq !== undefined) ? data.seq : state.lastSeq;
        renderModelInfo(data.model || '', !!data.is_fallback);
      } catch (err) { /* ignore */ }
    },
    agent_used: (data) => {
      try {
        state.lastSeq = (data.seq !== undefined) ? data.seq : state.lastSeq;
        // 后端实际使用的智能体：与本会话显示不一致时静默纠正（不阻断、无 400）
        const used = (data && data.agent) ? data.agent : '';
        state.boundAgent = used;
        paintHeaderAgent(used);
      } catch (err) { /* ignore */ }
    },
    done: (data) => {
      try {
        state.lastSeq = (data.seq !== undefined) ? data.seq : state.lastSeq;
        if (data.cancelled === true) {
          // fork 取消时 delegate end 可能丢失：须在 finalizeAnswer 复位 delegateSections 前兜底置中断态，
          // 否则 map 已空此调用为空操作，文案退化为泛化的"分析中断 · 中断"
          finalizePendingDelegateSections('cancelled');
        }
        if (pendingTokens.length && !toolCallSeen) {
          // 全程无工具调用（纯闲聊回退）：待定区即正文，去掉预览节点后并入
          // streamBuffer，经 finalizeAnswer 渲染进 answer-md
          const text = pendingTokens.join('');
          dropPendingPreview();
          streamBuffer = text + streamBuffer;  // 待定内容位于正文开头（preview 已展示过，此处合并定型）
        }
        finalizeAnswer();
        closeThinkRow();
        if (data.trace_id) state.traceId = data.trace_id;
      } catch (err) { /* ignore */ }
      streamRetryCount = 0; // 流正常结束，重置断线重连计数
      if (state.current === STATE.CLARIFYING) {
        // ask_user 期间流终止：取消（done+cancelled）或后端等待超时续答（done 正常结束），
        // 挂起的澄清输入均已失效，关闭 composer 恢复输入
        state.current = STATE.IDLE;
        restoreInputArea();
        if (data.cancelled === true) {
          showHint('澄清已失效，请重新提问');
        } else {
          showHint('该问题已超时，请重新提问');
        }
      } else {
        state.current = STATE.IDLE;
        setInputState(true);
        // 取最后一个 AI 气泡（不能用 :last-child：citation/model_info 在气泡之后）
        const aiRows = chatContainer.querySelectorAll('.bubble-row.ai');
        const lastAi = aiRows.length ? aiRows[aiRows.length - 1] : null;
        appendFeedback(lastAi ? lastAi.querySelector('.bubble-content') : null);
      }
      chatInputFocus();
      loadSessions(); // 首条消息后会话落库，刷新侧栏标题与 KB 绑定
    },
    error: (data) => {
      state.lastSeq = (data.seq !== undefined) ? data.seq : state.lastSeq;
      // fork 取消/异常时 delegate end 可能丢失：须在 finalizeAnswer 复位 delegateSections 前兜底置中断态
      finalizePendingDelegateSections('failed');
      dropPendingPreview(); // error 终态不走 done 的待定区合并，清理预览避免旁白样式残留
      finalizeAnswer();
      streamRetryCount = 0; // 服务端终态 error，不再重连
      if (state.current === STATE.STREAMING) {
        // 后端已归类时给出可区分文案（可用性类不含"重试"诱导）；
        // 未归类时 data.error 为空串 ⇒ 回落通用文案（与改造前逐字一致）
        showError(data.error || '连接异常，请重试');
        state.current = STATE.IDLE;
        setInputState(true);
      } else if (state.current === STATE.CLARIFYING) {
        // ask_user 期间服务端终态 error（续传超时/生成异常）：挂起澄清已失效，关闭 composer 恢复输入
        state.current = STATE.IDLE;
        restoreInputArea();
        showHint('澄清已失效，请重新提问');
      }
    },
    onError: (e) => {
      onStreamError(e);
    },
    onClose: () => {
      // 干净 EOF：主 POST 流若在 STREAMING 态未收终态（done/error），说明服务端
      // 因长静默/代理掐断收流但任务仍存活——按 lastSeq 自动续接（终态必达前不卡死输入框）。
      // 已收终态（state.current 已被 done/error 切回 IDLE）的 EOF 不续接，正常收尾。
      if (state.current === STATE.STREAMING) {
        streamRetryCount = 0;
        resumeStream(state.sessionId, state.lastSeq);
      }
    },
  };
}

function chatInputFocus() {
  const c = activeComposer();
  c.input.focus();
}

// 断点续接：GET /api/sessions/events?session_id=&after_seq=，复用同一套渲染 handlers
// 断线（onStreamError 退避）与刷新恢复（resumeIfGenerating）共用此入口
function resumeStream(sessionId, afterSeq) {
  if (state.abortController) {
    state.abortController.abort();
  }
  const url = '/api/sessions/events?session_id=' + encodeURIComponent(sessionId) + '&after_seq=' + afterSeq;
  const result = fetchStream(url, { method: 'GET' }, buildStreamHandlers());
  state.abortController = result.controller;
}

// 网络断开：指数退避（1s/2s/4s，最多 3 次）调 resume 续接，超过提示刷新
function onStreamError(e) {
  // 本地 abort（用户停止 / 新请求替换旧流 / 切换会话）：不视为错误，不重连
  if (e && (e.name === 'AbortError' || e.code === 20)) {
    return;
  }
  // 409：同一会话已有生成任务在跑（并发冲突），提示并转为查看状态（可 resume）
  if (e && e.status === 409) {
    state.abortController = null;
    state.current = STATE.IDLE;
    setInputState(true);
    showHint('当前会话正在处理中');
    renderResumePrompt();
    return;
  }
  if (state.current === STATE.CLARIFYING) {
    // ask_user 澄清期间断连：不重连（composer 交互在途），恢复输入并提示
    state.current = STATE.IDLE;
    restoreInputArea();
    showError('连接断开，请重试');
    return;
  }
  if (streamRetryCount < 3) {
    const delay = [1000, 2000, 4000][streamRetryCount];
    streamRetryCount++;
    state.current = STATE.STREAMING;
    showHint('连接已断开，正在自动重连...');
    state.retryTimer = setTimeout(() => {
      state.retryTimer = null;
      // 守卫：定时器触达时可能已开新流/切会话/已停止，不得用过期 state 续接
      if (state.current !== STATE.STREAMING) {
        return;
      }
      resumeStream(state.sessionId, state.lastSeq);
    }, delay);
    return;
  }
  // 重试耗尽：定型已渲染的部分答案，提示刷新恢复
  dropPendingPreview(); // 终态不走 done 的待定区合并，清理预览避免旁白样式残留
  finalizeAnswer();
  state.current = STATE.IDLE;
  setInputState(true);
  showError('连接已断开，多次重试失败，请刷新页面恢复');
}

function startStream(query) {
  if (state.abortController) {
    state.abortController.abort();
  }
  if (state.retryTimer !== null) {
    clearTimeout(state.retryTimer);
    state.retryTimer = null;
  }
  streamRetryCount = 0;
  state.lastSeq = 0; // 新一轮生成后端缓冲清空，seq 从 1 重计

  const url = '/api/chat/stream';

  const result = fetchStream(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      session_id: state.sessionId,
      kb_id: state.kbId,
      query: query,
      deep_thinking: state.deepThinking,
      agent: state.boundAgent || state.agent,   // 恢复会话用绑定值；新会话用选择器值
    }),
  }, buildStreamHandlers());
  state.abortController = result.controller;
}

// ── Send Message ──
function sendMessage() {
  const c = activeComposer();
  const query = c.input.value.trim();
  if (!query) return;
  if (state.current === STATE.STREAMING) return;

  c.input.value = '';
  // 程序清空不触发 input 事件重评，立即置 disabled；随后若切到历史对话页，
  // setInputState 只作用于 history composer，新对话页按钮状态在此保留（空输入 → disabled）
  c.sendBtn.disabled = true;

  // 新对话页发送首条消息：切到历史对话页展示消息流（KB 已随请求绑定）
  if ($('page-new').classList.contains('active')) {
    showHistoryPage();
  }
  removeStreamingState();

  renderUserBubble(query);

  // 首条消息：顶栏标题先取本条 query 占位（后端 save_session 落库后 loadSessions 刷新）
  if (!sessionMap[state.sessionId]) {
    updateHeader(query, state.kbName || '');
  }

  state.current = STATE.STREAMING;
  setInputState(false, '正在检索...');
  startStream(query);
}

// ── 停止生成：POST /api/sessions/cancel（置位后端 abort_signal，M4 消费）+ 本地 abort ──
function stopGeneration() {
  if (state.current !== STATE.STREAMING) return;
  // 通知后端置位 abort_signal；本地流先停，cancel 失败不阻塞本地停止
  try {
    fetch('/api/sessions/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: state.sessionId }),
    }).catch(() => { /* cancel 失败不阻塞本地停止 */ });
  } catch (err) { /* ignore */ }
  if (state.abortController) {
    state.abortController.abort();
    state.abortController = null;
  }
  // 本地 abort 使 done(cancelled) 事件不可达：须在 finalizeAnswer 复位 delegateSections 前兜底置取消态
  finalizePendingDelegateSections('cancelled');
  finalizeAnswer();
  closeThinkRow();
  state.current = STATE.IDLE;
  setInputState(true);
  renderStoppedNotice();
}

// 已停止提示：挂本轮气泡末尾（finalizeAnswer 保留 streamBubble 指针，此处落位同一气泡），
// 随该轮叙事持久保留（不复位、不跨轮清理）
function renderStoppedNotice() {
  const div = document.createElement('div');
  div.className = 'status-tag';
  div.innerHTML = escapeHtml('已停止');
  ensureProcessContainer().appendChild(div);
  scrollToBottom();
}

// 切换/新建会话时的流式复位：终止本地流，不渲染残留 buffer
function resetStreamingState() {
  if (state.abortController) {
    state.abortController.abort();
    state.abortController = null;
  }
  if (state.retryTimer !== null) {
    clearTimeout(state.retryTimer);
    state.retryTimer = null;
  }
  if (streamTimer !== null) {
    clearTimeout(streamTimer);
    streamTimer = null;
  }
  streamBuffer = '';
  streamBubble = null;
  answerMd = null;
  resetDelegateSections();
  hideComposer();
  state.current = STATE.IDLE;
  setInputState(true);
}

// 409 提示：当前会话已有生成任务在跑，提供「继续查看」接回原流（从缓冲开头续接）
function renderResumePrompt() {
  const div = document.createElement('div');
  div.className = 'status-tag';
  div.innerHTML = `
    <span class="status-dot"></span> 当前会话正在处理中
    <button type="button" class="resume-btn">继续查看</button>`;
  div.querySelector('.resume-btn').addEventListener('click', () => {
    state.current = STATE.STREAMING;
    setInputState(false, '正在恢复生成...');
    resumeStream(state.sessionId, state.lastSeq);
    div.remove();
  });
  chatContainer.appendChild(div);
  scrollToBottom();
}

// ── Events（双 composer 初始化） ──
function initComposerEvents(c) {
  if (!c.input || !c.sendBtn) return;
  c.sendBtn.addEventListener('click', sendMessage);
  if (c.stopBtn) {
    c.stopBtn.addEventListener('click', stopGeneration);
  }
  c.input.addEventListener('keydown', (e) => {
    if (handleSlashKeydown(e)) return;           // 补全优先消费按键
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });
  c.input.addEventListener('input', function () {
    onInputSlash(c.input);                       // 行首 / 补全
    c.sendBtn.disabled = this.value.trim().length === 0;
  });
}
initComposerEvents(composerNew());
initComposerEvents(composerHistory());

function initThinkingToggle(el) {
  if (!el) return;
  el.addEventListener('click', () => {
    state.deepThinking = !state.deepThinking;
    el.classList.toggle('active', state.deepThinking);
    el.setAttribute('aria-pressed', String(state.deepThinking));
    const other = el === $('newThinking') ? $('historyThinking') : $('newThinking');
    if (other) {
      other.classList.toggle('active', state.deepThinking);
      other.setAttribute('aria-pressed', String(state.deepThinking));
    }
  });
}
initThinkingToggle($('newThinking'));
initThinkingToggle($('historyThinking'));

      method: 'POST',

    kbListCache = (body && body.code === 'SUCCESS' && Array.isArray(body.data)) ? body.data : [];

// 向活动输入框行首插入 `/name `（已有内容时插入到最前并补一个空格，光标置于名称之后）
function insertSkillPrefix(name){
  const c = activeComposer();
  const input = c.input;
  const text = input.value || '';
  const prefix = '/' + name + ' ';
  if(text.length === 0){
    input.value = prefix;
  }else if(text.charAt(0) === '/'){
    input.value = prefix + text.replace(/^\S+\s*/, '');
  }else{
    input.value = prefix + text;
  }
  input.focus();
  input.setSelectionRange(prefix.length, prefix.length);
  input.dispatchEvent(new Event('input'));
}

// 选中技能：单选、更新 chip 文案与选中态；选中真实技能时插入前缀，选「不使用技能」时清除行首前缀
function selectSkill(name){
  state.skill = name || '';
  paintSkillChip();
  renderSkillMenu('newSkill');
  renderSkillMenu('historySkill');
  closeSkillMenu();
  if(state.skill){
    insertSkillPrefix(state.skill);
  }else{
    // 清除当前选择：剥掉活动输入框行首的 `/技能名 ` 前缀（与 insertSkillPrefix 同一正则），光标归位
    const input = activeComposer().input;
    const text = input.value || '';
    if(text.charAt(0) === '/'){
      input.value = text.replace(/^\S+\s*/, '');
      input.focus();
      input.setSelectionRange(0, 0);
      input.dispatchEvent(new Event('input'));
    }
  }
}

// 渲染技能菜单：首项「不使用技能」+ 真实技能；候选项带 data-name 供键盘选中
// （option 的 id 与 aria-activedescendant 由 T5 的 paintMenuNav 运行时写入，此处不写 id）
function renderSkillMenu(idPrefix){
  const box = $(idPrefix + 'List');
  if(!box) return;
  const hasReal = state.skills.some(function(s){ return !!s.name; });
  const current = state.skill || '';
  box.innerHTML = state.skills.map(function(s){

      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px"><path d="M3 5h7a4 4 0 0 1 4 4v10"/><path d="M21 5h-7a4 4 0 0 0-4 4v10"/></svg>'
      + '<span class="agent-item-info"><span class="agent-item-name">' + escapeHtml(label) + '</span>'
      + (desc ? '<span class="agent-item-desc">' + escapeHtml(desc) + '</span>' : '') + '</span>'
      + '<span class="check">' + (selected ? '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>' : '') + '</span>'
      + '</div>';
  }).join('') + (hasReal ? '' : '<div class="agent-menu-empty">暂无可调用技能</div>');
  Array.prototype.forEach.call(box.querySelectorAll('.agent-item'), function(el){

// 开合与 chip 状态：idPrefix ∈ {'newSkill','historySkill'}（两个 chip 共用同一份 state.skill）

// ── 输入框行首 / 命令补全（与技能 chip 共用 state.skills）──
let slashState = { open:false, frag:'', matches:[], active:0 };
const SLASH_FRAG_RE = /^\/([A-Za-z0-9_-]*)$/;   // 与后端 prefix.PREFIX_PATTERN 字符集同源

// 候选：排除「不使用技能」首项（name 为空），按 name 前缀匹配后字典序排序
function slashMatches(frag){
  return state.skills
    .filter(function(s){ return !!s.name && s.name.indexOf(frag) === 0; })
    .sort(function(a,b){ return a.name.localeCompare(b.name); });
}

function renderSlashMenu(){
  const c = activeComposer();
  const box = c.slashMenu;
  if(!box) return;
  if(!slashState.open){ box.classList.remove('open'); c.input.removeAttribute('aria-activedescendant'); return; }
  if(slashState.matches.length === 0){
    box.innerHTML = '<div class="slash-empty">没有匹配的技能</div>';
    box.classList.add('open');
    c.input.removeAttribute('aria-activedescendant');
    return;
  }
  box.innerHTML = slashState.matches.map(function(s, i){
    const on = (i === slashState.active);
    return '<div class="slash-item' + (on ? ' active' : '') + '" id="' + c.idPrefix + 'SlashOpt' + i + '"'
      + ' role="option" aria-selected="' + (on ? 'true' : 'false') + '" data-name="' + escapeHtml(s.name) + '">'
      + '<span class="slash-item-name">/' + escapeHtml(s.name) + '</span>'
      + (s.description ? '<span class="slash-item-desc">' + escapeHtml(s.description) + '</span>' : '')
      + '</div>';
  }).join('');
  box.classList.add('open');
  // 焦点留在输入框，用 aria-activedescendant 播报高亮项
  c.input.setAttribute('aria-activedescendant', c.idPrefix + 'SlashOpt' + slashState.active);
  Array.prototype.forEach.call(box.querySelectorAll('.slash-item'), function(el){
    el.addEventListener('mousedown', function(ev){
      ev.preventDefault();                       // 保焦点，避免 textarea 失焦
      applySlash(el.getAttribute('data-name'));
    });
  });
}

function onInputSlash(input){
  const m = SLASH_FRAG_RE.exec(input.value || '');
  if(!m){
    slashState.open = false;
    slashState.matches = [];
    renderSlashMenu();
    return;
  }
  slashState.open = true;
  slashState.frag = m[1];
  slashState.matches = slashMatches(slashState.frag);
  slashState.active = 0;
  renderSlashMenu();
}

// 插入选中技能：行首 /frag → /name␣（保留其余文本），光标置于名称之后
function applySlash(name){
  const c = activeComposer();
  const rest = (c.input.value || '').slice(slashState.frag.length + 1);  // +1 = 前导 '/'
  const prefix = '/' + name + ' ';
  c.input.value = prefix + rest;
  c.input.focus();
  c.input.setSelectionRange(prefix.length, prefix.length);
  c.input.dispatchEvent(new Event('input'));
  slashState.open = false;
  slashState.matches = [];
  renderSlashMenu();
}

// 键盘：返回 true = 已消费（调用方不得再走发送逻辑）
function handleSlashKeydown(e){
  if(!slashState.open) return false;
  if(e.key === 'Escape'){
    e.preventDefault();
    slashState.open = false;
    renderSlashMenu();
    return true;
  }
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    if(slashState.matches.length){
      if(e.key === 'ArrowDown' && slashState.active < slashState.matches.length - 1){
        slashState.active += 1;
      }
      if(e.key === 'ArrowUp' && slashState.active > 0){
        slashState.active -= 1;
      }
      renderSlashMenu();
    }
    return true;
  }
  if(e.key === 'Enter'){
    e.preventDefault();
    if(slashState.matches.length === 0){
      slashState.open = false;                   // 无匹配：关菜单且不发送
      renderSlashMenu();
      return true;
    }
    applySlash(slashState.matches[slashState.active].name);
    return true;
  }
  return false;
}

// 单选勾选：点 A 取消 B；再点当前项取消勾选
function pickKb(kbId, kbName) {

// ===== 无障碍与互斥（T5）：两个新菜单的通用键盘导航 + 瞬时浮层互斥 =====
const menuNav = { agent:{ active:-1 }, skill:{ active:-1 } };

// 统一关闭"瞬时浮层"：KB 菜单 / 智能体菜单 / 技能菜单 / 用户下拉。
// 不含引用抽屉与任务面板（"强浮层"，由 closeAllDrawers 管）。
function closeTransientOverlays(){
  closeKbMenu();
  closeAgentMenu();
  closeSkillMenu();
  const dd = document.getElementById('userDropdown');
  if(dd){ dd.classList.remove('show'); }
}

function menuOptions(menu){
  return Array.prototype.slice.call(menu.querySelectorAll('[role="option"]'));
}

// 候选 id + 键盘高亮态（class + 触发钮的 aria-activedescendant 两处同步）。
// aria-selected 归渲染函数所有（表示"已选中"），此处不触碰，避免高亮覆盖选中态。
function paintMenuNav(kind, triggerId, menuId, idPrefix){
  const menu = $(menuId);
  const trigger = $(triggerId);
  if(!menu || !trigger) return;
  const items = menuOptions(menu);
  const active = menuNav[kind].active;
  items.forEach(function(el, i){
    const on = (i === active);
    el.id = idPrefix + 'Opt' + i;
    el.classList.toggle('active', on);
  });
  if(active >= 0 && items[active]){
    trigger.setAttribute('aria-activedescendant', items[active].id);
  }else{
    trigger.removeAttribute('aria-activedescendant');
  }
}

// 通用键盘处理：返回 true = 已消费该按键
function handleMenuKeydown(kind, triggerId, menuId, idPrefix, e){
  const menu = $(menuId);
  if(!menu || !menu.classList.contains('open')) return false;
  const items = menuOptions(menu);
  if(e.key === 'Escape'){
    e.preventDefault();
    menuNav[kind].active = -1;
    if(kind === 'agent'){ closeAgentMenu(); } else { closeSkillMenu(); }
    $(triggerId).focus();                       // 关闭后焦点归还触发钮（规格 L122）
    return true;
  }
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    if(items.length){
      if(e.key === 'ArrowDown' && menuNav[kind].active < items.length - 1){
        menuNav[kind].active += 1;
      }
      if(e.key === 'ArrowUp' && menuNav[kind].active > 0){
        menuNav[kind].active -= 1;
      }
      paintMenuNav(kind, triggerId, menuId, idPrefix);
    }
    return true;
  }
  if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    const active = menuNav[kind].active;
    if(active >= 0 && items[active]){
      const name = items[active].getAttribute('data-name') || '';
      if(kind === 'agent'){ selectAgent(name); } else { selectSkill(name); }
    }else if(kind === 'agent'){
      closeAgentMenu();
    }else{
      closeSkillMenu();
    }
    $(triggerId).focus();
    return true;
  }
  return false;
}

const agentTrigger = $('agentTrigger');
agentTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  const menu = $('agentMenu');
  if (menu.classList.contains('open')) {
    closeAgentMenu();
  } else {
    menuNav.agent.active = -1;                // 鼠标开：清除键盘残留高亮
    openAgentMenu();
  }
});
agentTrigger.addEventListener('keydown', (e) => {
  if (handleMenuKeydown('agent', 'agentTrigger', 'agentMenu', 'agent', e)) return;
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    menuNav.agent.active = 0;                 // 键盘打开默认高亮首项（「默认」）
    openAgentMenu();
  }
});
// 技能 chip 开合（两个 composer 各一枚，共用 state.skill；T5 补键盘导航）
function wireSkillChip(idPrefix){
  const chip = $(idPrefix + 'Chip');
  chip.addEventListener('click', (e) => {
    e.stopPropagation();
    const menu = $(idPrefix + 'Menu');
    if (menu.classList.contains('open')) {
      closeSkillMenu();
    } else {
      menuNav.skill.active = -1;              // 鼠标开：清除键盘残留高亮
      openSkillMenu(idPrefix);
    }
  });
  chip.addEventListener('keydown', (e) => {
    if (handleMenuKeydown('skill', idPrefix + 'Chip', idPrefix + 'Menu', idPrefix, e)) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      menuNav.skill.active = 0;               // 键盘打开默认高亮首项
      openSkillMenu(idPrefix);
    }
  });
}
wireSkillChip('newSkill');
wireSkillChip('historySkill');
document.addEventListener('click', (e) => {
  const menu = $('kbMenu');
  if (menu && menu.classList.contains('open') &&
      !menu.contains(e.target) && !kbTrigger.contains(e.target)) {

  const agentMenu = $('agentMenu');
  if (agentMenu && agentMenu.classList.contains('open') &&
      !agentMenu.contains(e.target) && !agentTrigger.contains(e.target)) {
    closeAgentMenu();
  }
  const newSkillMenu = $('newSkillMenu');
  if (newSkillMenu && newSkillMenu.classList.contains('open') &&
      !newSkillMenu.contains(e.target) && !$('newSkillChip').contains(e.target)) {
    closeSkillMenu();
  }
  const historySkillMenu = $('historySkillMenu');
  if (historySkillMenu && historySkillMenu.classList.contains('open') &&
      !historySkillMenu.contains(e.target) && !$('historySkillChip').contains(e.target)) {
    closeSkillMenu();
  }
});

// ── Sidebar / 会话历史 / 用户区 ──

function generateTraceId() {
  return 'trace_' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36).slice(2, 10));
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (!sidebar) return;
  sidebar.classList.toggle('open');
  if (overlay) overlay.classList.toggle('show');
}

// 相对时间（刚刚 / Xm / Xh / Xd / 具体日期）
function formatRelTime(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  const diff = Date.now() - t;
  const min = Math.floor(diff / 60000);
  if (min < 1) return '刚刚';
  if (min < 60) return `${min}m`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h`;
  const day = Math.floor(hr / 24);
  if (day < 30) return `${day}d`;
  return new Date(iso).toLocaleDateString('zh-CN');
}

// 加载会话历史列表（POST /api/sessions/list）
async function loadSessions() {
  const listEl = $('sessionList');
  if (!listEl) return false;
  try {
    const res = await fetch('/api/sessions/list', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Trace-ID': generateTraceId() },
      body: JSON.stringify({}),
    });
    const body = await res.json().catch(() => null);
    const sessions = (body && body.code === 'SUCCESS' && Array.isArray(body.data)) ? body.data : [];
    sessionMap = {};
    if (!sessions.length) {
      listEl.innerHTML = '<div class="sidebar-empty">暂无会话历史</div>';
      return true;
    }
    sessions.forEach(s => { sessionMap[s.id] = s; });
    listEl.innerHTML = sessions.map(s => {
      const title = s.title || s.id.slice(0, 8);
      const rel = formatRelTime(s.updated_at);
      return `<button type="button" class="session-item ${s.id === state.sessionId ? 'active' : ''}" onclick="switchSession('${escapeHtml(s.id)}')" title="${escapeHtml(title)}">
        <span class="session-title">${escapeHtml(title)}</span>
        <span class="rel-time">${rel}</span>
      </button>`;
    }).join('');
    return true;
  } catch (e) {
    listEl.innerHTML = '<div class="sidebar-empty">加载失败</div>';
    return false;
  }
}

// ── 历史回放过程重建（design D6/D7：静态渲染变体，不复用实时 handler——副作用边界，
// 零运行期全局状态；类名与 DOM 结构同实时路径 renderStatusTag / renderReasoningDelta /
// ensureDelegateSection 逐一对齐，保证历史回放与实时观看视觉一致）──

// 定型回放中的 Think 块（与实时 closeThinkRow 同规则：折叠摘要定格为首行），返回 null 复位指针
function closeReplayThinkRow(thinkRow) {
  if (!thinkRow) return null;
  const body = thinkRow.querySelector('.think-body');
  const summary = thinkRow.querySelector('.think-summary');
  if (body && summary) {
    const full = body.textContent;
    const newline = full.indexOf('\n');
    if (newline === -1) {
      summary.textContent = full;
    } else {
      summary.textContent = full.slice(0, newline);
    }
  }
  return null;
}

// 历史过程重建：按序渲染持久化事件到指定 bubble-content（v3 单气泡：调用方先经
// createAssistantBubble 建泡再传入，过程元素与正文渲染进同一容器，与实时路径同构）
function rebuildProcessFromEvents(container, events) {
  let statusGroup = null;  // 相邻 status 合并组（rebuild 局部指针，遇非 status 事件置 null）
  let thinkRow = null;     // 开放的 Think 块（rebuild 局部指针，遇非 reasoning 事件定型）
  let delegateSec = null;  // 开放的委派区（start 建、end 定格；delta 已聚合为最终文本）
  for (const ev of events) {
    const t = ev.type;
    const p = ev.payload || {};
    if (t === 'status') {
      // 防数据异常：status 前未定型的 Think 块按实时规则收口
      thinkRow = closeReplayThinkRow(thinkRow);
      if (!statusGroup) {
        statusGroup = document.createElement('div');
        statusGroup.className = 'pg-group';
        container.appendChild(statusGroup);
      }
      const div = document.createElement('div');
      div.className = 'status-tag';
      // 回放与实时视觉一致（见本段自述契约）：降级告知同样给琥珀配色，
      // 与实时 renderStatusTag 的 status-tag-degraded 对齐
      if (p.stage === 'degraded') {
        div.classList.add('status-tag-degraded');
      }
      let text = escapeHtml(p.message || '');
      if (p.detail) {
        text += ' <span class="status-detail">' + escapeHtml(p.detail) + '</span>';
      }
      div.innerHTML = `<span class="status-dot"></span> ${text}`;
      statusGroup.appendChild(div);
    } else if (t === 'preamble') {
      statusGroup = null;
      thinkRow = closeReplayThinkRow(thinkRow);
      const el = document.createElement('p');
      el.className = 'narration';
      el.textContent = p.text || '';
      container.appendChild(el);
    } else if (t === 'reasoning') {
      // 深度思考场景：reasoning 帧按 Think 块累积渲染（无活跃块则创建，结构与实时一致）
      statusGroup = null;
      if (!thinkRow) {
        thinkRow = document.createElement('details');
        thinkRow.className = 'think-row';
        thinkRow.innerHTML = `
          <summary>
            <span class="think-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg></span>
            <span class="think-title">Think</span>
            <span class="think-summary"></span>
            <span class="think-chevron"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </summary>
          <div class="think-body"></div>`;
        container.appendChild(thinkRow);
      }
      const body = thinkRow.querySelector('.think-body');
      const summary = thinkRow.querySelector('.think-summary');
      body.textContent += p.delta || '';
      summary.textContent = latestReasoningLine(body.textContent);
    } else if (t === 'delegate') {
      statusGroup = null;
      thinkRow = closeReplayThinkRow(thinkRow);
      if (p.action === 'start') {
        // 委派区重建：结构与实时 ensureDelegateSection 同构（head 可点击折叠）
        delegateSec = document.createElement('section');
        delegateSec.className = 'delegate-progress';
        const title = escapeHtml(p.skill || '专家') + ' · 领域专家分析';
        delegateSec.innerHTML = `
          <button type="button" class="delegate-head" aria-expanded="true">
            <span class="delegate-dot running"></span>
            <span class="delegate-title">${title}</span>
            <span class="delegate-status">正在分析…</span>
            <svg class="delegate-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="delegate-body">
            <details class="delegate-think" open>
              <summary>思考过程</summary>
              <div class="delegate-think-body"></div>
            </details>
            <div class="delegate-content"></div>
          </div>`;
        container.appendChild(delegateSec);
        const head = delegateSec.querySelector('.delegate-head');
        head.addEventListener('click', () => {
          const closed = delegateSec.classList.toggle('closed');
          head.setAttribute('aria-expanded', String(!closed));
        });
      } else if (p.action === 'delta' && delegateSec) {
        if (p.kind === 'thinking') {
          delegateSec.querySelector('.delegate-think-body').textContent += p.delta || '';
        } else {
          delegateSec.querySelector('.delegate-content').textContent += p.delta || '';
        }
      } else if (p.action === 'end' && delegateSec) {
        // ok/reason 定格：与实时 finalizeDelegateSection 同规则（含既有中文映射）
        const dot = delegateSec.querySelector('.delegate-dot');
        const status = delegateSec.querySelector('.delegate-status');
        const ok = p.ok !== false;
        if (ok) {
          dot.classList.remove('running');
          dot.classList.add('done');
          status.textContent = '领域专家分析完成';
        } else {
          const reasonText = DELEGATE_REASON_TEXT[p.reason] || p.reason || '';
          dot.classList.remove('running');
          dot.classList.add('error');
          status.textContent = '分析中断 · ' + reasonText;
          status.classList.add('error');
        }
        // end 已定格，复位指针：避免循环后兜底把已正常收尾的节误判为未闭合
        delegateSec = null;
      }
    } else if (t === 'ask_user') {
      // 澄清帧渲染为静态注记（澄清问题与回答已在后续 user 消息中）
      statusGroup = null;
      thinkRow = closeReplayThinkRow(thinkRow);
      renderAskUserNote(container);
    }
    // token/citation/model_info/done/error 帧：跳过
    // （正文由 content 列、引用由 sources 列、模型与终态由既有列承载，见 process_log.py）
  }
  // 循环收尾：无悬挂开放元素（对齐循环内遇非同型事件的复位/定型规则）
  statusGroup = null;
  thinkRow = closeReplayThinkRow(thinkRow);
  // 兜底：fork 取消时 delegate end 帧可能因 drain 竞态未持久化（H2），循环结束后
  // 仍开放的委派区定格为中断态（reason 取 cancelled，与实时 finalizePendingDelegateSections
  // 对 done(cancelled) 的兜底同规则），避免回放永久停留"正在分析…"呼吸点
  if (delegateSec) {
    const dot = delegateSec.querySelector('.delegate-dot');
    const status = delegateSec.querySelector('.delegate-status');
    const text = DELEGATE_REASON_TEXT['cancelled'] || '已取消';
    dot.classList.remove('running');
    dot.classList.add('error');
    status.textContent = '分析中断 · ' + text;
    status.classList.add('error');
  }
}

// ask_user 帧的静态注记（历史回放专用）
function renderAskUserNote(container) {
  const div = document.createElement('div');
  div.className = 'status-tag';
  div.innerHTML = `<span class="status-dot"></span> 已向用户澄清`;
  container.appendChild(div);
}

// 加载指定会话的历史消息并渲染（POST /api/sessions/messages），返回消息数
async function loadSessionMessages(sessionId) {
  chatContainer.innerHTML = '';
  resetCiteState();
  try {
    const res = await fetch('/api/sessions/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Trace-ID': generateTraceId() },
      body: JSON.stringify({ session_id: sessionId }),
    });
    const body = await res.json().catch(() => null);
    const messages = (body && body.code === 'SUCCESS' && Array.isArray(body.data)) ? body.data : [];
    if (!messages.length) return 0;
    messages.forEach(m => {
      if (m.role === 'user') {
        renderUserBubble(m.content || '');
      } else if (m.role === 'assistant') {
        // v3 单气泡：先创建 assistant 气泡行，过程事件重建与正文渲染进同一 bubble-content
        //（数据形状校验：format_version===1 + events 数组；存量 process=null 跳过重建仅渲终稿）
        const content = createAssistantBubble();
        if (m.process && m.process.format_version === 1 && Array.isArray(m.process.events)) {
          rebuildProcessFromEvents(content, m.process.events);
        }
        renderAiAnswerInto(content, m.content || '', m.status === 'interrupted');
        // 历史回放重建引用：sources 由后端反序列化为数组（结构化 dict / 旧扁平串），
        // 渲染横条并可展开抽屉（含 snippet）；刷新/切换会话后引用不丢失
        attachHistoryCitations(lastAiRow(), m.sources);
        // 历史回放重建模型标注：从既有 model_name 列还原「由 X 回答」，位置与引用栏同级
        attachHistoryModelNote(lastAiRow(), m.model_name);
      }
    });
    return messages.length;
  } catch (e) {
    return 0;
  }
}

// 切换会话：更新 session_id 与 KB 绑定，加载历史消息，进入历史对话页
async function switchSession(sessionId) {
  if (sessionId === state.sessionId) return;
  resetStreamingState();
  state.sessionId = sessionId;
  localStorage.setItem('rag_session_id', sessionId);
  syncHeaderFromSession();
  showHistoryPage();
  loadSessions();
  await loadSessionMessages(sessionId);
  loadTaskSnapshot(sessionId); // 任务/进度看板快照（task-board change）
  if (window.innerWidth < 768) toggleSidebar();
}

// 新建会话：生成新 session_id，重置 KB 选择器，进入新对话页
function newSession() {
  resetStreamingState();
  const sid = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  state.sessionId = sid;
  localStorage.setItem('rag_session_id', sid);
  resetKbSelector();
  selectAgent(''); // 新会话回到「默认」智能体
  state.boundAgent = ''; // 新会话无绑定值，请求体回退到选择器 state.agent
  state.skill = ''; // 新会话清空消息级技能
  slashState.open = false; // 行首 / 补全菜单复位
  renderSlashMenu(); // 复位后重渲染，避免残留的 .slash-menu.open 带入新会话
  // 剥掉活动输入框行首的 `/技能名 ` 前缀（与 selectSkill('') 同一正则），
  // 避免 chip 显示「技能」但下次发送仍带技能；保留其余文本并派发 input 刷新发送按钮
  const slashInput = activeComposer().input;
  const slashText = slashInput.value || '';
  if (slashText.charAt(0) === '/') {
    slashInput.value = slashText.replace(/^\S+\s*/, '');
    slashInput.setSelectionRange(0, 0);
    slashInput.dispatchEvent(new Event('input'));
  }
  paintSkillChip();
  updateHeader('', '');
  paintHeaderAgent(''); // 顶栏智能体段归零，避免残留上一会话的只读回显
  showNewPage();
  loadSessions();
  clearTaskBoard(); // 新会话无任务，本地清空看板，避免残留上一个会话条目（task-board change）
  if (window.innerWidth < 768) toggleSidebar();
}

// ── User Area（登录/退出，侧栏底部） ──

// 登录校验：返回当前登录 user_id；未登录 / token 无效 / 请求失败 → null
function verifyLogin() {
  return fetch('/api/auth/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Trace-ID': generateTraceId() },
    body: JSON.stringify({}),
  })
    .then(r => r.json().catch(() => null))
    .then(d => {
      if (d && d.code === 'SUCCESS' && d.data && d.data.valid) {
        return d.data.user_id;
      }
      return null;
    })
    .catch(() => null);
}

// 跳登录页并携带当前路径，登录后回跳
function redirectToLogin() {
  location.replace('/login.html?redirect=' + encodeURIComponent(location.pathname + location.search));
}

function updateUserArea(userId) {
  const el = $('userArea');
  if (!el) return;
  if (!userId) {
    el.innerHTML = `<a href="/login.html?redirect=${encodeURIComponent(location.pathname + location.search)}" class="user-avatar">
      <div class="avatar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="user-meta">
        <div class="user-name">未登录</div>
        <div class="user-action">登录</div>
      </div>
    </a>`;
    return;
  }
  const initial = (userId.charAt(0) || 'U').toUpperCase();
  el.innerHTML = `
    <div class="user-menu">
      <button class="user-avatar" type="button" onclick="toggleUserDropdown(event)" title="用户菜单">
        <div class="avatar">${escapeHtml(initial)}</div>
        <div class="user-meta">
          <div class="user-name">${escapeHtml(userId)}</div>
          <div class="user-action">退出登录</div>
        </div>
      </button>
      <div class="user-dropdown" id="userDropdown">
        <button type="button" onclick="handleLogout()">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1"/></svg>
          退出登录
        </button>
      </div>
    </div>`;
}

function toggleUserDropdown(e) {
  if (e) e.stopPropagation();
  const dd = document.getElementById('userDropdown');
  if (!dd) return;
  const wasOpen = dd.classList.contains('show');
  dd.classList.toggle('show', !wasOpen);
  if (!wasOpen) {
    document.addEventListener('click', closeOnClickOutside);
  }
}

// Esc 关闭瞬时浮层 / 引用抽屉 / 任务面板（task-board 复用既有 keydown，不重复注册监听）
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    // 优先级：瞬时浮层（新菜单）→ 强浮层（引用抽屉 / 任务面板）
    if ($('agentMenu') && $('agentMenu').classList.contains('open')) {
      closeAgentMenu();
      $('agentTrigger').focus();
      return;
    }
    if ($('newSkillMenu') && $('newSkillMenu').classList.contains('open')) {
      closeSkillMenu();
      $('newSkillChip').focus();
      return;
    }
    if ($('historySkillMenu') && $('historySkillMenu').classList.contains('open')) {
      closeSkillMenu();
      $('historySkillChip').focus();
      return;
    }
    const drawer = document.getElementById('citeDrawer');
    if (drawer && drawer.classList.contains('open')) {
      closeCiteDrawer();
    } else if (taskBoard.open) {
      closeTaskBoard();
    }
  }
});

function closeOnClickOutside(e) {
  const dd = document.getElementById('userDropdown');
  const ua = document.getElementById('userArea');
  if (dd && ua && !ua.contains(e.target)) {
    dd.classList.remove('show');
    document.removeEventListener('click', closeOnClickOutside);
  }
}

async function handleLogout() {
  try {
    await fetch('/api/auth/logout', { method: 'POST' });
  } catch (_) {}
  document.cookie = 'token=; path=/; max-age=0';
  location.href = '/login.html';
}

// ── Init（登录门禁：chat 依赖登录态，未登录/校验失败先跳登录页再加载内容）──
(async function boot() {
  const authUserId = await verifyLogin();
  updateUserArea(authUserId);
  if (!authUserId) {
    redirectToLogin();
    return;
  }
  // 区分新/旧会话：localStorage 无 rag_session_id 说明是全新对话（新浏览器/未开过对话）
  const hadSavedSession = !!localStorage.getItem('rag_session_id');
  state.sessionId = getOrCreateSessionId();

  // 捕获两个 composer 的 HTML 默认 placeholder，setInputState(true) 时还原
  (function capturePlaceholders() {
    const n = $('newInput');
    const h = $('historyInput');
    if (n) _origPlaceholder.new = n.placeholder;
    if (h) _origPlaceholder.history = h.placeholder;
  })();

  // 刷新恢复：加载历史后查任务状态，generating 时从缓冲开头续接当前轮（seq 0 回放）
  async function resumeIfGenerating(sessionId) {
    try {
      const res = await fetch('/api/sessions/task-status?session_id=' + encodeURIComponent(sessionId), {
        method: 'GET',
        headers: { 'X-Trace-ID': generateTraceId() },
      });
      const body = await res.json().catch(() => null);
      if (body && body.code === 'SUCCESS' && body.data && body.data.status === 'generating') {
        state.current = STATE.STREAMING;
        setInputState(false, '正在恢复生成...');
        resumeStream(sessionId, 0);
      }
    } catch (e) { /* 状态查询失败静默，不打断页面 */ }
  }

  // 初始化：加载 KB 与会话列表；rag_session_id 命中当前用户真实会话且有消息 →
  // 历史对话页并尝试续接；空壳/他人会话 id 不再拉消息（避免必然的 404 噪音）。
  // loadSessions 成功（返回 true）时以 sessionMap membership 为准；列表拉取失败
  // 时回退旧行为（有历史 id 仍尝试恢复），避免列表故障连带丢失会话恢复能力。
  loadKBs();
  loadAgents();
  loadSkills();
  loadSessions().then((listOk) => {
    const known = listOk ? !!sessionMap[state.sessionId] : hadSavedSession;
    if (!known) {
      showNewPage();
      // 空壳/已删会话无任务可读（快照接口对此类 id 必然 404），本地清空看板即可
      clearTaskBoard();
      return;
    }
    loadSessionMessages(state.sessionId).then((count) => {
      if (count > 0) {
        syncHeaderFromSession();
        showHistoryPage();
        // 仅历史对话页（有历史消息）才尝试续接生成中的回答；
        // 新对话页（count === 0）没有可回放的消息流，不应 resume 到隐藏容器
        resumeIfGenerating(state.sessionId);
      } else {
        showNewPage();
      }
      // 刷新恢复：历史与空会话均以快照初始化看板；若在 generating，resume 流中的
      // task 事件增量会继续 upsert（task-board change）
      loadTaskSnapshot(state.sessionId);
    });
  });
})();

// stick 滚动：监听消息流滚动，上滑暂停自动跟随
chatThread.addEventListener('scroll', onChatScroll);

// 侧栏「新建会话」
$('newSessionBtn').addEventListener('click', newSession);
</script>
