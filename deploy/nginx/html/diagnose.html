<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>诊断详情 — Corporate RAG</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1e293b}
.wrap{max-width:860px;margin:0 auto;padding:32px 20px}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 24px rgba(15,23,42,.06);margin-bottom:16px}
h1{font-size:20px;margin:0 0 4px}
.meta{font-size:13px;color:#94a3b8}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.badge{font-size:13px;padding:4px 10px;border-radius:999px;background:#eef2ff;color:#4338ca}
.badge.warn{background:#fef3c7;color:#b45309}
.badge.ok{background:#dcfce7;color:#15803d}
h2{font-size:14px;color:#64748b;margin:0 0 12px;font-weight:600;letter-spacing:.02em}
ul{margin:0;padding-left:18px;line-height:1.8}
li{font-size:14px}
pre{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px;font-size:12px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.empty{font-size:14px;color:#94a3b8}
a.back{display:inline-block;margin-top:8px;font-size:13px;color:#6366f1;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="title">诊断详情</h1>
    <div class="meta" id="meta">加载中…</div>
    <div class="row" id="badges"></div>
  </div>
  <div class="card"><h2>结论依据</h2><ul id="assertions"></ul></div>
  <div class="card"><h2>证据清单</h2><ul id="evidence"></ul></div>
  <div class="card"><h2>建议动作</h2><div id="actions" class="empty">无</div></div>
  <div class="card"><h2>原始记录</h2><pre id="raw">—</pre></div>
  <a class="back" href="chat.html">返回对话</a>
</div>
<script>
const API='/api';
const diagId=new URLSearchParams(location.search).get('diag_id')||'';
const $=id=>document.getElementById(id);

function badge(text,cls){const s=document.createElement('span');s.className='badge '+(cls||'');s.textContent=text;return s}

function tierClass(tier){if(tier==='需要处理')return 'warn';if(tier==='无需处理')return 'ok';return ''}

function fillList(el,items,render){
  el.innerHTML='';
  if(!items||!items.length){const li=document.createElement('li');li.className='empty';li.textContent='无';el.appendChild(li);return}
  items.forEach(it=>{const li=document.createElement('li');render(li,it);el.appendChild(li)});
}

async function load(){
  if(!diagId){$('meta').textContent='缺少 diag_id 参数';return}
  const r=await fetch(`${API}/rca/diag/${encodeURIComponent(diagId)}`,{credentials:'include'});
  if(r.status===401){
    location.href='login.html?redirect='+encodeURIComponent(location.pathname+location.search);
    return;
  }
  const body=await r.json();
  if(!r.ok){$('meta').textContent=body.message||'加载失败';return}
  const d=body.data;
  $('title').textContent='诊断 · '+d.kind;
  $('meta').textContent=`trace ${d.trace_id} ｜ ${d.created_at} ｜ 耗时 ${d.cost_ms}ms ｜ 触发 ${d.trigger}`;
  const badges=$('badges');
  badges.appendChild(badge(d.tier,tierClass(d.tier)));
  badges.appendChild(badge('归属：'+d.owner));
  badges.appendChild(badge('根因：'+d.root_cause));
  fillList($('assertions'),d.assertions,(li,a)=>{li.textContent=`${a.text}（${(a.evidence_ids||[]).join('、')}）`});
  fillList($('evidence'),d.evidence,(li,e)=>{li.textContent=`${e.id} · ${e.kind} · ${e.locator} · ${e.summary}`});
  $('actions').textContent=d.next_actions||'无';
  $('raw').textContent=JSON.stringify({diag_id:d.diag_id,trace_id:d.trace_id,env:d.env},null,2);
}

load().catch(err=>{$('meta').textContent='加载失败：'+err.message});
</script>
</body>
</html>
