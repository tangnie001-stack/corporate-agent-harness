[build-system]
# PEP 639 的 license 写法（`license = "MIT"`）需要 setuptools >= 77
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-rag"
version = "0.1.0"
description = "Corporate Agent Harness — 聊天底座 + 可插拔工具/知识库（RAG 为其能力模块之一）"
authors = [{name = "tangnie"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy<2.0",
    "langchain-openai==1.3.3",
    # 统一 token 计数入口（src/infra/llm/token_count.py）顶层直接 import tiktoken；
    # 此前仅由 langchain-openai 传递提供，故显式声明为运行时依赖。pin 精确版本：
    # 分词口径随版本漂移会改变上下文预算的估算结果，升级须复核
    "tiktoken==0.13.0",
    "langchain==1.3.11",
    "langchain-community==0.4.2",
    "langchain-core==1.4.8",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.9",
    "langfuse>=2.60.0,<3.0.0",
    "fastapi==0.138.0",
    "httpx>=0.27,<1.0",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.49.0",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "loguru==0.7.3",
    "chardet==7.4.3",
    "redis==8.0.0",
    "dashscope>=1.26.3",
    # pin 精确版本：分词结果随 chunks.tsv 生成列固化落库，版本漂移会让存量与新
    # 查询侧口径不一致（静默降召回），变更必须配 scripts/rewrite_content_seg.py --apply
    "jieba==0.42.1",
    "minio>=7.2.0,<8.0.0",
    "pymupdf4llm==1.28.2",
    # PostgreSQL 关系型存储：asyncpg 为 SQLAlchemy 异步驱动，pgvector 提供向量类型，
    # sqlalchemy 此前仅作传递依赖，已被直接 import，故显式声明并带 asyncio extra
    "asyncpg>=0.30.0,<1.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    # 密码哈希：src/utils/auth_crypto.py 直接 import bcrypt；此前仅由 chromadb 传递提供，
    # 已随 Chroma 退役一并消失，故显式声明为运行时依赖，不可移除
    "bcrypt==5.0.0",
    # 企微回调加解密：AES-256-CBC + PKCS#7（块 32），官方 WXBizMsgCrypt 亦用 PyCryptodome
    "pycryptodome>=3.20,<4.0",
    # 迁移：部署时在容器内执行 alembic upgrade head，因此属**运行时依赖**（原先误置于 [dev]）
    "alembic==1.19.0",
    # 企微智能机器人长连接：官方客户端 SDK（WebSocket，含认证/心跳/重连/流式/事件分发）
    "wecom-aibot-python-sdk==1.0.2",
    # provider 兼容层数据面：src/infra/llm/provider/registry.yaml 用 YAML（带注释）。
    # 此前仅由传递依赖提供，直接 import yaml 故显式声明。
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "deepeval==4.2.9",  # 评测入口；其内建 RAGAS 桥调经典四指标
    "click==8.3.3",  # 下限：与 deepeval 的 click 约束共存（design D1）
    "huggingface_hub==1.16.1",  # 下限：防回落到与 deepeval 互斥的一侧
    "rapidfuzz==3.14.5",
    "datasets==4.0.0",
    "pyright==1.1.411",
    "pre-commit==4.6.1",
    "ruff==0.16.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# async 测试共享 session 级 event loop，避免 SQLAlchemy async 连接池
# 跨 loop 复用导致 "Task got Future attached to a different loop"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    # 空只读表 fail-closed：单测未走 build_graph 注册工具，构造 executor 时表为空即命中；
    # 生产路径由 build_graph 在请求前注册工具，表恒非空，不会命中。
    # 断言该 warning 的用例（tests/agents/skills/test_fork_tools.py）用 pytest.warns
    # 自行捕获，pytest.warns 覆盖本过滤器，不受影响。
    "ignore:.*工具只读表为空",
    # 无 tool_provider 的 executor（测试装配）在工具已注册时会发此 warning；
    # 生产路径由 build_graph 的 tool_sink 恒注入 provider，不会命中。
    # 断言该 warning 的用例（tests/agents/skills/test_skill_executor.py）用 pytest.warns
    # 自行捕获，pytest.warns 覆盖本过滤器，不受影响。
    "ignore:.*未装配 tool_provider",
]

[tool.pyright]
extraPaths = ["src"]
# 显式指定 python 解释器来源的 venv，确保第三方依赖可解析
venvPath = "."
venv = ".venv"

[tool.doc_anchors]
# 文档防腐检查（src/cli/check_docs.py）排除表。
# 各键的**默认值在 src/cli/check_docs.py 的 _DEFAULT_* 常量**（与校验逻辑同处，
# 避免两处各写一份）；本表只能**追加**，不能摘掉默认项（并集语义）。
# exclude_docs: 整篇跳过校验（意向清单/外部引用）
# exclude_symbols: 允许出现在文档但不要求代码中存在的标识符
#   （事故档案中的历史函数名、API 数据枚举值等）
# exclude_skill_tools: skill frontmatter allowed-tools 中允许引用但代码不存在的工具名
#   （如文档/示例中的历史工具名）
# extra_docs: 除 docs/agents/*.md 外还要校验的项目内文档（默认含根 README.md /
#   CLAUDE.md / src/api/README.md —— 对外入口文档的漂移同样致命）
# banned_terms: 已退役/改名技术的字样（大小写不敏感子串），命中即 error。
#   默认含 MySQL / Chroma / BM25 / financial-qa / create_react_agent / sse_utils /
#   qwen-max / text-embedding-v3 / gte-rerank。新增技术替换时把旧名加进来。
# banned_term_exempt_docs: 整篇豁免禁用词的文档（其职责就是记录"曾经用什么"：
#   术语表 / 接口契约的历史踩坑表 / 操作记录 / 缺陷档案）。
#   现行机制文档里偶有一处必须保留的溯源（如"原历史包名 mysql_db 的改名已完成"），
#   在该行加行内标记 `<!-- doc-anchors-allow -->` 即可单行豁免，不必整篇移出保护。
exclude_docs = ["requirements_pool.md", "reference-projects.md"]
exclude_symbols = [
    "ci_gate",
    "handle_chat",
    "create_kb",
    # chunking-issues.md 档案中的历史旧名（迁移时已拆分，注记指向现状）
    "HEADER_FOOTER_MARGIN",
]
exclude_skill_tools = []


[tool.ruff.lint.per-file-ignores]
# FastAPI 路由的 Depends()/File() 默认参数是官方依赖注入的标准写法，B008 为误报
"src/api/*.py" = ["B008"]
